<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="MyData - Personal Business Management Dashboard"
    >

    <title>MyData | Business Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f5f7fb;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #111827;
        }

        .loading {
            text-align: center;
        }

        .logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 18px;

            border-radius: 16px;

            background: #111827;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: 700;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            font-size: 20px;
            margin-bottom: 7px;
        }

        p {
            font-size: 13px;
            color: #9ca3af;
        }

        .spinner {
            width: 22px;
            height: 22px;

            margin: 20px auto 0;

            border: 3px solid #e5e7eb;
            border-top-color: #111827;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="loading">

        <div class="logo">
            MD
        </div>

        <h1>MyData</h1>

        <p>
            Memeriksa sesi login...
        </p>

        <div class="spinner"></div>

    </main>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://yevvekkwhovevqcvyhxv.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_Vx9PlEUAX3NyVVEVMSzmDQ_XwtUYZKW";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        async function checkSession() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(
                    "Session error:",
                    error
                );

                window.location.href =
                    "login.html";

                return;
            }


            if (data.session) {

                // Sudah login
                window.location.href =
                    "dashboard.html";

            } else {

                // Belum login
                window.location.href =
                    "login.html";

            }

        }


        checkSession();

    </script>

</body>

</html>
