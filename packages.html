<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paket | Admin Dashboard</title>

    <link rel="stylesheet" href="css/packages.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <div class="logo-box">WB</div>

            <div>
                <h2>WebBusiness</h2>
                <span>Admin Panel</span>
            </div>
        </div>

        <nav class="sidebar-menu">

            <a href="dashboard.html">
                📊
                <span>Dashboard</span>
            </a>

            <a href="customers.html">
                👥
                <span>Pelanggan</span>
            </a>

            <a href="packages.html" class="active">
                📦
                <span>Paket</span>
            </a>

            <a href="projects.html">
                📁
                <span>Project</span>
            </a>

            <a href="insight.html">
                📈
                <span>Insight</span>
            </a>

            <a href="hosting.html">
                🖥️
                <span>Hosting</span>
            </a>

            <a href="settings.html">
                ⚙️
                <span>Pengaturan</span>
            </a>

        </nav>

        <button id="logoutButton" class="logout-button">
            🚪
            <span>Logout</span>
        </button>

    </aside>


    <!-- MAIN -->
    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Paket</h1>
                <p>Kelola paket layanan website kamu.</p>
            </div>

            <button id="openPackageModal" class="add-button">
                + Tambah Paket
            </button>

        </header>


        <!-- TOOLBAR -->
        <section class="toolbar">

            <div class="search-box">
                🔎
                <input
                    type="text"
                    id="searchPackage"
                    placeholder="Cari paket..."
                >
            </div>

            <select id="filterStatus">
                <option value="all">Semua Paket</option>
                <option value="active">Aktif</option>
                <option value="inactive">Nonaktif</option>
            </select>

        </section>


        <!-- PACKAGE LIST -->
        <section class="package-section">

            <div id="packageList" class="package-grid">

                <div class="loading">
                    Memuat paket...
                </div>

            </div>

        </section>

    </main>

</div>


<!-- MODAL -->
<div id="packageModal" class="modal">

    <div class="modal-card">

        <div class="modal-header">

            <div>
                <h2 id="modalTitle">Tambah Paket</h2>
                <p>Buat paket layanan baru.</p>
            </div>

            <button id="closePackageModal" class="close-button">
                ×
            </button>

        </div>


        <form id="packageForm">

            <input type="hidden" id="packageId">


            <div class="form-group">

                <label for="packageName">
                    Nama Paket
                </label>

                <input
                    type="text"
                    id="packageName"
                    placeholder="Contoh: Basic Website"
                    required
                >

            </div>


            <div class="form-group">

                <label for="packageDescription">
                    Deskripsi
                </label>

                <textarea
                    id="packageDescription"
                    placeholder="Jelaskan isi paket..."
                    rows="3"
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="packagePrice">
                        Harga
                    </label>

                    <input
                        type="number"
                        id="packagePrice"
                        min="0"
                        placeholder="1500000"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="revisionLimit">
                        Batas Revisi
                    </label>

                    <input
                        type="number"
                        id="revisionLimit"
                        min="0"
                        placeholder="3"
                    >

                    <label class="checkbox-small">

                        <input
                            type="checkbox"
                            id="unlimitedRevision"
                        >

                        Unlimited

                    </label>

                </div>

            </div>


            <div class="features-box">

                <h3>Fitur Paket</h3>


                <label class="feature-item">

                    <input
                        type="checkbox"
                        id="hostingIncluded"
                    >

                    <span>
                        🖥️ Hosting termasuk
                    </span>

                </label>


                <label class="feature-item">

                    <input
                        type="checkbox"
                        id="domainIncluded"
                    >

                    <span>
                        🌐 Domain termasuk
                    </span>

                </label>


                <label class="feature-item">

                    <input
                        type="checkbox"
                        id="maintenanceIncluded"
                    >

                    <span>
                        🛠️ Maintenance termasuk
                    </span>

                </label>

            </div>

            <label class="feature-item">

    <input
        type="checkbox"
        id="physicalItemIncluded"
    >
 
    <span>
        📦 Barang fisik termasuk
    </span>

</label>


            <p id="packageError" class="error-message"></p>


            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelPackage"
                    class="cancel-button"
                >
                    Batal
                </button>

                <button
                    type="submit"
                    id="savePackage"
                    class="save-button"
                >
                    Simpan Paket
                </button>

            </div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/packages.js"></script>

</body>
</html>
